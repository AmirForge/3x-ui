name: Check subscription names

on:
  workflow_dispatch:
  pull_request:
    paths:
      - internal/sub/**
      - .github/workflows/name-label-check.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format and parse changed Go files
        run: gofmt -w internal/sub/remark_vars.go internal/sub/multilocation_name_test.go
      - name: Test subscription rendering
        run: go test ./internal/sub -count=1
